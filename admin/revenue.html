<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kurukoo Admin - Revenue</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="/css/admin-pages/admin-base.css">
    <script src="/admin/admin-auth.js"></script>
</head>
<body>
    <div class="header-bar">
        <div class="logo"><span>Kurukoo</span> Admin</div>
        <nav>
            <a href="/admin/dashboard.html">Console</a>
            <a href="/admin/revenue.html" class="active">Revenue Streams</a>
        </nav>
    </div>
    <div class="container">
        <h2>Commercial Revenue</h2>
        <p>Canonical revenue, provider entitlement and settlement evidence from the commercial ledger.</p>
        <div class="card-grid" id="revenue-grid"><div class="stat-card">Loading...</div></div>
    </div>
    <script>
        const money = value => `₦${Math.round(Number(value || 0)).toLocaleString()}`;
        fetch('/api/commercial/revenue/summary').then(async r => { const data = await r.json(); if (!r.ok) throw new Error(data.error || 'Unable to load revenue summary'); return data; }).then(data => {
            document.getElementById('revenue-grid').innerHTML = `
                <div class="stat-card"><div class="stat-value">${money(data.grossMinor)}</div><div class="stat-label">Gross Commercial Value</div></div>
                <div class="stat-card"><div class="stat-value">${money(data.platformFeesMinor)}</div><div class="stat-label">Kurukoo Platform Revenue</div></div>
                <div class="stat-card"><div class="stat-value">${money(data.providerPayoutsMinor)}</div><div class="stat-label">Provider Entitlements</div></div>
                <div class="stat-card"><div class="stat-value">${money(data.processingCostsMinor)}</div><div class="stat-label">Processing Costs</div></div>
                <div class="stat-card"><div class="stat-value">${money(data.refundsMinor)}</div><div class="stat-label">Refunds</div></div>
                <div class="stat-card"><div class="stat-value">${Number(data.eventCount || 0).toLocaleString()}</div><div class="stat-label">Commercial Events</div></div>
            `;
        }).catch(error => { document.getElementById('revenue-grid').innerHTML = `<div class="stat-card"><div class="stat-value">Unavailable</div><div class="stat-label">${String(error.message || 'Revenue unavailable')}</div></div>`; });
    </script>
</body>
</html>
