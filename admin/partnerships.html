<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kurukoo Admin - Partnerships</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="/css/admin-pages/admin-base.css">
    <script src="/admin/admin-auth.js"></script>
</head>
<body>
    <div class="header-bar">
        <div class="logo"><span>Kurukoo</span> Admin</div>
        <nav>
            <a href="/admin/dashboard.html">Console</a>
            <a href="/admin/partnerships.html" class="active">Partnerships</a>
        </nav>
    </div>
    <div class="container">
        <h2>Partnerships Timeline</h2>
        <div class="card-box">
            <table>
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Contact</th>
                        <th>Status</th>
                        <th>Next Action</th>
                        <th>Due Date</th>
                    </tr>
                </thead>
                <tbody id="partnerships-tbody">
                    <tr><td colspan="5">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        fetch('/api/admin/partnerships').then(r => r.json()).then(data => {
            document.getElementById('partnerships-tbody').innerHTML = data.map(p => `
                <tr>
                    <td><strong>${p.company}</strong></td>
                    <td>${p.contact}</td>
                    <td><span class="badge">${p.status}</span></td>
                    <td>${p.next_action}</td>
                    <td>${p.due_date}</td>
                </tr>
            `).join('');
        });
    </script>
</body>
</html>
