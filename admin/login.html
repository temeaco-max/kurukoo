<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Admin Login | Kurukoo</title>
    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="/css/admin-console.css">
    <link rel="stylesheet" href="/css/admin-auth.css">
    <link rel="stylesheet" href="/css/admin-pages/admin-base.css">
    <script src="/admin/admin-auth.js"></script>
</head>
<body class="admin-auth-page admin-shell">
<main class="admin-auth-shell">
    <section class="admin-auth-card" aria-labelledby="admin-login-title">
        <div class="admin-auth-brand" aria-label="Kurukoo Admin">
            <span class="admin-auth-brand-mark" aria-hidden="true"><svg class="k-icon k-icon--sm"><use href="/icons/kurukoo-icons.svg#chat"></use></svg></span>
            <span>Kurukoo Admin</span>
        </div>
        <h1 id="admin-login-title">Sign in</h1>
        <p class="admin-auth-description">Access the operational console for authorised Kurukoo administrators.</p>
        <form id="login-form" class="admin-auth-form" novalidate>
            <div class="admin-auth-field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="admin-auth-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <p id="login-status" class="admin-auth-status" role="alert" aria-live="polite"></p>
            <button type="submit" id="login-submit" class="btn-primary admin-auth-submit">Sign in</button>
        </form>
    </section>
</main>
<script src="/admin/login.js" defer></script>
</body>
</html>
