<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Kurukoo Admin — Future Plans</title>
  <link rel="stylesheet" href="/css/site.css?v=1.2.0">
    <link rel="stylesheet" href="/css/admin-pages/admin-base.css">
    <script src="/admin/admin-auth.js"></script>
</head>
<body class="admin-page">
  <main class="container">
    <header class="page-header">
      <div>
        <p class="eyebrow">Admin console</p>
        <h1>Future plans</h1>
        <p class="muted">A read-only roadmap view for work that is already defined in the Kurukoo product plan.</p>
      </div>
      <a class="btn btn-secondary" href="/admin/dashboard.html">Back to console</a>
    </header>

    <section class="card" aria-labelledby="plans-title">
      <div class="card-header">
        <div>
          <h2 id="plans-title">Roadmap</h2>
          <p class="muted" id="status-text">Loading plans…</p>
        </div>
        <button class="btn btn-secondary" id="refresh" type="button">Refresh</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>ID</th><th>Title</th><th>Description</th><th>Phase</th><th>Status</th></tr></thead>
          <tbody id="plans-tbody"><tr><td colspan="5">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const tbody = document.getElementById('plans-tbody');
    const statusText = document.getElementById('status-text');

    async function loadPlans() {
      statusText.textContent = 'Loading plans…';
      tbody.innerHTML = '<tr><td colspan="5">Loading…</td></tr>';
      try {
        const response = await fetch('/api/admin/future_plans', { credentials: 'same-origin', headers: { 'x-admin-token': localStorage.getItem('kurukoo_admin') || '' } });
        if (!response.ok) throw new Error(`Request failed (${response.status})`);
        const data = await response.json();
        tbody.replaceChildren();
        if (!Array.isArray(data) || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5">No roadmap items.</td></tr>';
          statusText.textContent = 'No roadmap items found.';
          return;
        }
        for (const item of data) {
          const row = document.createElement('tr');
          [item.id ? `#${item.id}` : '', item.title, item.description, item.phase, item.status].forEach(value => {
            const cell = document.createElement('td');
            cell.textContent = String(value ?? '');
            row.appendChild(cell);
          });
          tbody.appendChild(row);
        }
        statusText.textContent = `${data.length} roadmap item${data.length === 1 ? '' : 's'} loaded.`;
      } catch (error) {
        tbody.innerHTML = '<tr><td colspan="5">Unable to load roadmap.</td></tr>';
        statusText.textContent = error.message || 'Unable to load roadmap.';
      }
    }

    document.getElementById('refresh').addEventListener('click', loadPlans);
    loadPlans();
  </script>
</body>
</html>
