<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kurukoo Admin - Scam Reports</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="/css/admin-pages/admin-base.css">
    <script src="/admin/admin-auth.js"></script>
</head>
<body>
    <div class="header-bar">
        <div class="logo"><span>Kurukoo</span> Admin</div>
        <nav>
            <a href="/admin/dashboard.html">Console</a>
            <a href="/admin/scam.html" class="active">Scam Reports</a>
        </nav>
    </div>
    <div class="container">
        <h2>Scam Reports & Mitigation</h2>
        <div class="card-box">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Reporter</th>
                        <th>Reported Provider</th>
                        <th>Description</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="reports-tbody">
                    <tr><td colspan="5">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        fetch('/api/admin/scam_reports').then(r => r.json()).then(data => {
            document.getElementById('reports-tbody').innerHTML = data.map(s => `
                <tr>
                    <td>#${s.id}</td>
                    <td>${s.reporter_phone}</td>
                    <td><strong>${s.reported_phone}</strong></td>
                    <td>${s.description}</td>
                    <td><span class="badge">${s.status}</span></td>
                </tr>
            `).join('') || '<tr><td colspan="5">No scam reports found.</td></tr>';
        });
    </script>
</body>
</html>
