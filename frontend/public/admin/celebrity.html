<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Kurukoo Admin — Celebrity Demand</title>
  <link rel="stylesheet" href="/css/site.css?v=1.2.0">
    <link rel="stylesheet" href="/css/admin-pages/admin-base.css">
    <script src="/admin/admin-auth.js"></script>
</head>
<body class="admin-page">
  <main class="container">
    <header class="page-header">
      <div>
        <p class="eyebrow">Admin console</p>
        <h1>Celebrity demand</h1>
        <p class="muted">Monitor demand signals and thresholds before a creator or public figure is added to the marketplace.</p>
      </div>
      <a class="btn btn-secondary" href="/admin/dashboard.html">Back to console</a>
    </header>

    <section class="card" aria-labelledby="summary-title">
      <div class="card-header">
        <div>
          <h2 id="summary-title">Demand signals</h2>
          <p class="muted" id="status-text">Loading demand data…</p>
        </div>
        <button class="btn btn-secondary" id="refresh" type="button">Refresh</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Name</th><th>Category</th><th>Interested users</th><th>Threshold</th><th>Status</th></tr></thead>
          <tbody id="celebrity-tbody"><tr><td colspan="5">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const tbody = document.getElementById('celebrity-tbody');
    const statusText = document.getElementById('status-text');
    const escapeText = value => String(value ?? '');

    async function loadDemand() {
      statusText.textContent = 'Loading demand data…';
      tbody.innerHTML = '<tr><td colspan="5">Loading…</td></tr>';
      try {
        const response = await fetch('/api/admin/celebrity', { credentials: 'same-origin', headers: { 'x-admin-token': localStorage.getItem('kurukoo_admin') || '' } });
        if (!response.ok) throw new Error(`Request failed (${response.status})`);
        const data = await response.json();
        tbody.replaceChildren();
        if (!Array.isArray(data) || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5">No demand signals yet.</td></tr>';
          statusText.textContent = 'No demand signals found.';
          return;
        }
        for (const item of data) {
          const row = document.createElement('tr');
          [item.name, item.category, item.interested_users, item.threshold, item.status].forEach(value => {
            const cell = document.createElement('td');
            cell.textContent = escapeText(value);
            row.appendChild(cell);
          });
          tbody.appendChild(row);
        }
        statusText.textContent = `${data.length} demand signal${data.length === 1 ? '' : 's'} loaded.`;
      } catch (error) {
        tbody.innerHTML = '<tr><td colspan="5">Unable to load demand data.</td></tr>';
        statusText.textContent = error.message || 'Unable to load demand data.';
      }
    }

    document.getElementById('refresh').addEventListener('click', loadDemand);
    loadDemand();
  </script>
</body>
</html>
