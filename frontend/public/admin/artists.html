<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kurukoo Admin - Verified Artists</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="/css/admin-pages/admin-base.css">
    <script src="/admin/admin-auth.js"></script>
</head>
<body>
    <div class="header-bar">
        <div class="logo"><span>Kurukoo</span> Admin</div>
        <nav>
            <a href="/admin/dashboard.html">Console</a>
            <a href="/admin/artists.html" class="active">Verified Artists</a>
        </nav>
    </div>
    <div class="container">
        <h2>Verified Artist Applications</h2>
        <p>Manage high-profile talent bookings (mandatory escrow, manager contacts, 24-hr cooling off).</p>
        <div class="card-box">
            <table>
                <thead>
                    <tr>
                        <th>Phone</th>
                        <th>Skill / Talent</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="artists-tbody">
                    <tr><td colspan="4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        function loadArtists() {
            fetch('/api/admin/artists').then(r => r.json()).then(data => {
                document.getElementById('artists-tbody').innerHTML = data.map(a => `
                    <tr>
                        <td>${a.phone}</td>
                        <td><strong>${a.skill}</strong></td>
                        <td>${a.verified_artist ? 'Verified' : 'Pending'}</td>
                        <td>
                            <button type="button" class="btn" onclick="toggleVerify('${a.phone}', '${a.skill}', ${a.verified_artist ? 0 : 1})">
                                ${a.verified_artist ? 'Revoke' : 'Verify'}
                            </button>
                        </td>
                    </tr>
                `).join('') || '<tr><td colspan="4">No artist skills found.</td></tr>';
            });
        }
        function toggleVerify(phone, skill, verifyStatus) {
            fetch('/api/admin/artists/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, skill, verified_artist: verifyStatus })
            }).then(r => r.json()).then(data => {
                if (data.success) loadArtists();
            });
        }
        window.onload = loadArtists;
    </script>
</body>
</html>
