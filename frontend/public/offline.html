<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You are Offline — Kurukoo</title>
    <link rel="stylesheet" href="/css/site.css?v=1.2.0">
    <link rel="stylesheet" href="/css/offline.css?v=1.1.0">
    <link rel="stylesheet" href="/css/kurukoo-platform-state-visual.css?v=3">
</head>
<body class="offline-page">
    <div class="offline-card">
        <div class="offline-icon" aria-hidden="true"><svg><use href="/icons/kurukoo-icons.svg#alert"></use></svg></div>
        <span class="public-status public-status--pending">Offline</span>
        <h1>Kurukoo is offline</h1>
        <p>Cached Kurukoo surfaces remain available. New messages are not sent automatically; reconnect and choose Retry when you are ready.</p>
        <div class="offline-context" role="note"><strong>Your context is protected.</strong><span>Nothing is sent in the background. When you reconnect, you choose whether to retry.</span></div>
        <div class="actions">
            <button class="btn-primary" id="retry-button" type="button">Try again</button>
            <a href="/home" class="btn-secondary">Open Home</a>
        </div>
    </div>
    <script src="/js/offline.js?v=1.0.0" defer></script>
</body>
</html>
