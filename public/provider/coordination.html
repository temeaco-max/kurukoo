<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Provider coordination | Kurukoo</title>
  <style>
    :root{--ink:#2e2e2e;--muted:#6e6a66;--line:#e7ded4;--paper:#fffdfa;--ground:#fbf6ef;--accent:#d97a5c;--good:#18794e;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}main{max-width:940px;margin:auto;padding:28px 18px 64px}header{display:flex;gap:16px;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}h1,h2{font-family:Georgia,serif;letter-spacing:-.025em}h1{font-size:clamp(30px,6vw,46px);margin:0}h2{font-size:22px;margin:0 0 8px}.eyebrow{margin:0 0 5px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.muted{color:var(--muted)}button,input,textarea{font:inherit}.refresh,.primary,.secondary,.danger{border-radius:8px;min-height:40px;padding:8px 12px;cursor:pointer}.refresh,.secondary{background:#fff;border:1px solid var(--line)}.primary{background:var(--accent);color:#fff;border:1px solid var(--accent)}.danger{background:#fff0ee;color:var(--danger);border:1px solid #f4c7c2}.list{display:grid;gap:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:17px}.top{display:flex;gap:10px;justify-content:space-between;align-items:start}.pill{background:#f2ebe4;color:var(--muted);font-size:12px;padding:3px 8px;border-radius:999px;white-space:nowrap}.requirements{margin:11px 0;padding:10px;background:#fcf8f4;border-radius:8px;font-size:13px;overflow:auto}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.quote-form{display:grid;grid-template-columns:1fr 110px;gap:8px;margin-top:14px}.quote-form textarea{grid-column:1/-1;min-height:68px;resize:vertical}.quote-form input,.quote-form textarea{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}.quote-form label{display:grid;gap:4px;color:var(--muted);font-size:12px}.notice{padding:14px;border:1px solid #cce6d5;border-radius:10px;background:#f5fff8;color:#195c3b}.error{padding:14px;border:1px solid #efc2bd;border-radius:10px;background:#fff6f5;color:var(--danger)}@media(max-width:600px){header{align-items:start;flex-direction:column}.quote-form{grid-template-columns:1fr}.quote-form textarea{grid-column:auto}}
  </style>
</head>
<body>
<main>
  <header><div><p class="eyebrow">Provider workspace</p><h1>Coordination queue</h1><p class="muted">Accept only work you can genuinely perform. This page records your response in Kurukoo’s internal queue; it does not claim an external message was delivered or a payment was received.</p></div><button class="refresh" id="refresh" type="button">Refresh</button></header>
  <section id="notice" class="notice" hidden></section><section id="queue" class="list"><article class="card"><p class="muted">Loading your verified-provider queue…</p></article></section>
</main>
<script>
  const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const queue=document.querySelector('#queue'), notice=document.querySelector('#notice');
  const show=(text,error=false)=>{notice.hidden=false;notice.className=error?'error':'notice';notice.textContent=text;};
  async function respond(id,response,card){
    const amount=card.querySelector('[data-quote]')?.value;
    const note=card.querySelector('[data-note]')?.value;
    if(response==='accepted'&&(!/^\d+$/.test(amount||'')||Number(amount)<=0)){show('Enter a positive whole-number quote before accepting.',true);return;}
    const buttons=[...card.querySelectorAll('button')];buttons.forEach(button=>button.disabled=true);
    try{const res=await fetch(`/api/coordination/provider/invitations/${encodeURIComponent(id)}/respond`,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({response,quoteMinor:response==='accepted'?Number(amount):undefined,currency:'NGN',note,idempotencyKey:`provider-ui:${id}:${response}`})});const data=await res.json().catch(()=>({}));if(!res.ok||!data.success)throw new Error(data.error||'Response unavailable');show(response==='accepted'?'Your quote was recorded for the customer to review. Payment has not been confirmed.':'Your decline was recorded.');await load();}catch(error){buttons.forEach(button=>button.disabled=false);show(error.message||'Could not record response.',true);}}
  function card(invitation){const req=invitation.request||{};const article=document.createElement('article');article.className='card';article.innerHTML=`<div class="top"><div><h2>${esc(req.skill||'Request')}</h2><p class="muted">Request status: ${esc(req.status||'unknown')}</p></div><span class="pill">${esc(invitation.status)}</span></div><pre class="requirements">${esc(JSON.stringify(req.requirements||{},null,2))}</pre>`;if(invitation.status==='invited'){const form=document.createElement('div');form.className='quote-form';form.innerHTML='<label>Quote in NGN minor units<input data-quote inputmode="numeric" placeholder="e.g. 250000"></label><label>Currency<input value="NGN" disabled></label><label>Optional note<textarea data-note maxlength="500" placeholder="Describe scope or availability without sharing sensitive information."></textarea></label>';article.appendChild(form);const actions=document.createElement('div');actions.className='actions';const accept=document.createElement('button');accept.className='primary';accept.textContent='Accept and submit quote';accept.addEventListener('click',()=>respond(invitation.id,'accepted',article));const decline=document.createElement('button');decline.className='danger';decline.textContent='Decline';decline.addEventListener('click',()=>respond(invitation.id,'declined',article));actions.append(accept,decline);article.appendChild(actions);}else if(invitation.status==='accepted'){article.appendChild(Object.assign(document.createElement('p'),{className:'muted',textContent:`Quote recorded: ${invitation.quoteMinor??'—'} ${invitation.currency||''}. Waiting for the customer to review.`}));}else{article.appendChild(Object.assign(document.createElement('p'),{className:'muted',textContent:'Response recorded.'}));}return article;}
  async function load(){try{const response=await fetch('/api/coordination/provider/invitations',{credentials:'same-origin'});if(response.status===401)throw new Error('Sign in with a verified provider account to view this queue.');const data=await response.json().catch(()=>({}));if(!response.ok||!data.success)throw new Error(data.error||'Provider queue unavailable');queue.replaceChildren();if(!data.invitations?.length){queue.innerHTML='<article class="card"><h2>No requests waiting</h2><p class="muted">New requests appear here only after Kurukoo has matched a verified capability and created an internal invitation.</p></article>';return;}data.invitations.forEach(invitation=>queue.appendChild(card(invitation)));}catch(error){queue.innerHTML=`<article class="card error">${esc(error.message||'Provider queue unavailable.')}</article>`;}}
  document.querySelector('#refresh').addEventListener('click',load);load();
</script>
</body>
</html>
