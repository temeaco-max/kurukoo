<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kurukoo QR</title><link rel="stylesheet" href="/css/kurukoo-qr.css?v=2">  <link rel="stylesheet" href="/css/legacy-inline-migration.css?v=1">
</head>
<body><div class="wrap"><p>Kurukoo</p><div class="card"><h1>Share Kurukoo with a QR code</h1><p>Generate a safe entry QR for referrals, contributors, network entry, offers, or a channel hand-off. Scanning never signs someone in or completes a transaction.</p><div class="grid"><section><label for="context">Context</label><select id="context"><option value="referral">Referral</option><option value="contributor">Contributor</option><option value="network">Network</option><option value="offer">Offer</option><option value="channel">Channel connection</option></select><label for="channel legacy-inline-21v09h">Channel (optional)</label><select id="channel"><option value="">None</option><option value="whatsapp">WhatsApp</option><option value="telegram">Telegram</option><option value="sms">SMS</option><option value="ussd">USSD</option></select><button id="generate" class="legacy-inline-4kzkbz">Generate QR</button><div id="message" class="url"></div><div id="url" class="url"></div></section><section class="qr" id="qr"><span>Generate your QR</span></section></div><div class="legacy-inline-oaycet"><button id="download" disabled>Download QR</button><button id="share" disabled>Share</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script>
(async()=>{const $=id=>document.getElementById(id), canvas=document.createElement('canvas');$('qr').append(canvas);canvas.hidden=true;let current='';
async function generate(){ $('message').textContent='Generating…'; const q=new URLSearchParams({context:$('context').value}); if($('channel').value)q.set('channel',$('channel').value); const r=await fetch('/api/user/referral/qr?'+q,{credentials:'include'}); const d=await r.json(); if(!r.ok||!d.success){$('message').textContent=d.error||'Sign in to generate your personal QR.';return} current=d.url;canvas.hidden=false;await QRCode.toCanvas(canvas,current,{width:240,margin:2});$('url').textContent=current;$('message').textContent='Ready to print or share.';$('download').disabled=false;$('share').disabled=false}
$('generate').onclick=generate;$('download').onclick=()=>{const a=document.createElement('a');a.download='kurukoo-qr.png';a.href=canvas.toDataURL('image/png');a.click()};$('share').onclick=async()=>{if(navigator.share){await navigator.share({title:'Join me on Kurukoo',text:'Start chatting with Kurukoo',url:current})}else{await navigator.clipboard.writeText(current);$('message').textContent='Link copied.'}};
})();</script></body></html>
