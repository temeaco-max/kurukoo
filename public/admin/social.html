<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/admin/admin-brand.js"></script>
    <meta charset="UTF-8">
    <title>Kurukoo Admin - Social Media</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">
    <style>
        :root { --cream: #FFF8F0; --terracotta: #D97A5C; --electric-blue: #1E88E5; --charcoal: #2E2E2E; }
        body { background-color: var(--cream); font-family: 'Inter', sans-serif; color: var(--charcoal); margin:0; padding:0; }
        .header-bar { background: var(--charcoal); color: var(--cream); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: var(--terracotta); }
        nav a { color: var(--cream); text-decoration: none; margin-left: 20px; font-weight: 500; font-size: 14px; padding: 6px 12px; border-radius: 4px; transition: background 0.2s; }
        nav a:hover, nav a.active { background: rgba(255,248,240,0.15); }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .card-box { background: #FFFFFF; border: 1px solid #E0D0C0; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 12px rgba(46,46,46,0.03); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; font-family: 'Inter', sans-serif; box-sizing: border-box; }
        .btn { background: var(--terracotta); color: #FFF; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 14px; }
        th, td { padding: 12px 16px; border-bottom: 1px solid #E0D0C0; text-align: left; }
        th { background: rgba(217,122,92,0.1); font-family: 'Space Grotesk', sans-serif; font-weight: 600; color: var(--charcoal); }
    </style>
  <link rel="stylesheet" href="/css/admin-console.css">
</head>
<body>
    <div class="header-bar">
        <div class="logo"><span>Kurukoo</span> Admin</div>
        <nav>
            <a href="/admin/dashboard.html">Console</a>
            <a href="/admin/social.html" class="active">Social Scheduler</a>
        </nav>
    </div>
    <div class="container">
        <h2>Schedule Social Post</h2>
        <div class="card-box">
            <form id="social-form" onsubmit="schedulePost(event)">
                <div class="form-group">
                    <label>Platform</label>
                    <select id="s-platform">
                        <option value="twitter">Twitter</option>
                        <option value="facebook">Facebook</option>
                        <option value="instagram">Instagram</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Content</label>
                    <textarea id="s-content" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>Scheduled Time</label>
                    <input type="datetime-local" id="s-time" required>
                </div>
                <button type="submit" class="btn">Schedule Post</button>
            </form>
        </div>
        <div class="card-box">
            <h3>Scheduled Posts</h3>
            <table>
                <thead><tr><th>ID</th><th>Platform</th><th>Time</th><th>Status</th></tr></thead>
                <tbody id="posts-tbody"><tr><td colspan="4">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
    <script>
        function loadPosts() {
            fetch('/api/admin/social').then(r => r.json()).then(data => {
                document.getElementById('posts-tbody').innerHTML = data.map(p => `
                    <tr><td>#${p.id}</td><td>${p.platform}</td><td>${p.scheduled_time}</td><td>${p.status}</td></tr>
                `).join('') || '<tr><td colspan="4">No posts.</td></tr>';
            });
        }
        function schedulePost(e) {
            e.preventDefault();
            const payload = {
                platform: document.getElementById('s-platform').value,
                content: document.getElementById('s-content').value,
                scheduled_time: document.getElementById('s-time').value
            };
            fetch('/api/admin/social', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                loadPosts();
                document.getElementById('social-form').reset();
            });
        }
        window.onload = loadPosts;
    </script>
</body>
</html>
