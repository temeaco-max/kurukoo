<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kurukoo Admin - Revenue</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

  <link rel="stylesheet" href="/css/legacy-inline-migration.css?v=1">
</head>
<body>
    <div class="header-bar">
        <div class="logo"><span>Kurukoo</span> Admin</div>
        <nav>
            <a href="/admin/dashboard.html">Console</a>
            <a href="/admin/revenue.html" class="active">Revenue Streams</a>
        </nav>
    </div>
    <div class="container">
        <h2>Monetisation Streams</h2>
        <div class="card-grid" id="revenue-grid">
            <div class="stat-card">Loading...</div>
        </div>
    </div>
    <script>
        fetch('/api/admin/revenue').then(r => r.json()).then(data => {
            document.getElementById('revenue-grid').innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">₦${data.subscriptions.toLocaleString()}</div>
                    <div class="stat-label">Subscription Revenue</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">₦${data.lead_fees.toLocaleString()}</div>
                    <div class="stat-label">Lead Fees</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">₦${data.ad_revenue.toLocaleString()}</div>
                    <div class="stat-label">Ad Revenue</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${data.affiliate_clicks.toLocaleString()} Clicks</div>
                    <div class="stat-label">Affiliate Traffic</div>
                </div>
                <div class="stat-card legacy-inline-1hddrid">
                    <div class="stat-value">Phase 2</div>
                    <div class="stat-label">Data Sales</div>
                </div>
                <div class="stat-card legacy-inline-1hddrid">
                    <div class="stat-value">Phase 2</div>
                    <div class="stat-label">Telco Promotions</div>
                </div>
            `;
        });
    </script>
</body>
</html>
