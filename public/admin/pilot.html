<!doctype html>
<html lang="en">
<head>
  <script src="/admin/admin-brand.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kurukoo Pilot Dashboard</title>

  <link rel="stylesheet" href="/css/legacy-inline-migration.css?v=1">
  <link rel="stylesheet" href="/css/admin-console.css">
</head>
<body>
<main>
  <header><div><p class="label">Operator surface</p><h1>Human pilot observability</h1><p class="muted">Aggregate signals only. No owner identifiers, secrets, or raw conversations are loaded here.</p></div><button id="refresh" type="button">Refresh</button></header>
  <section id="decision" class="decision"><span class="muted">Loading pilot decision…</span></section>
  <section id="metrics" class="grid"></section>
  <section><h2>Recovery signals</h2><div id="recovery" class="grid"></div></section>
  <section><h2>Coordinator handoffs</h2><div id="handoffs" class="table-wrap"><p class="muted legacy-inline-sqsnti">Loading…</p></div></section>
  <section><h2>Feedback distribution</h2><div id="feedback-summary" class="grid"></div></section>
</main>
<script>
  const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const metric = (label, value) => `<article class="card"><div class="label">${esc(label)}</div><div class="metric">${esc(value)}</div></article>`;
  function decision(data){
    const d=data.dashboard||{}, total=Number(d.total_events||0), failed=Number(d.failed_events||0), feedback=Number(d.feedback_total||0);
    const noGo=total>0 && failed/total>.2;
    document.querySelector('#decision').className=`decision ${noGo?'no-go':'go'}`;
    document.querySelector('#decision').innerHTML=`<strong>${noGo?'NO-GO':'GO — continue controlled pilot'}</strong><p class="muted">${noGo?'Failure rate is above the controlled-pilot threshold; pause invites and inspect recovery paths.':'No aggregate stop signal exceeded the current threshold. Keep the invite cohort at 5–10 users and review this surface daily.'} Feedback records in window: ${feedback}.</p>`;
  }
  async function updateHandoff(id,status){
    try{const response=await fetch(`/api/coordination/admin/handoffs/${encodeURIComponent(id)}`,{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});const data=await response.json().catch(()=>({}));if(!response.ok||!data.success)throw new Error(data.error||'Coordinator action unavailable');await load();}catch(error){document.querySelector('#handoffs').innerHTML=`<p class="error legacy-inline-sqsnti">${esc(error.message)}</p>`;}
  }
  async function loadHandoffs(){
    const response=await fetch('/api/coordination/admin/handoffs',{credentials:'same-origin'});if(!response.ok)throw new Error('Coordinator queue unavailable.');const data=await response.json();const rows=data.handoffs||[];document.querySelector('#handoffs').innerHTML=rows.length?`<table><thead><tr><th>Created</th><th>Request</th><th>Reason</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${esc(row.createdAt)}</td><td><code>handoff-${esc(String(row.id||'').slice(0,8))}</code></td><td>${esc(row.reason)}</td><td><span class="pill">${esc(row.status)}</span></td><td>${row.status==='requested'?`<button data-handoff="${esc(row.id)}" data-status="claimed">Claim</button>`:row.status==='claimed'?`<button data-handoff="${esc(row.id)}" data-status="resolved">Resolve</button>`:'—'}</td></tr>`).join('')}</tbody></table>`:'<p class="muted legacy-inline-sqsnti">No open coordinator handoffs.</p>';document.querySelectorAll('[data-handoff]').forEach(button=>button.addEventListener('click',()=>updateHandoff(button.dataset.handoff,button.dataset.status)));
  }
  async function load(){
    try{
      const response=await fetch('/api/admin/pilot-dashboard?days=30',{credentials:'same-origin'});
      if(response.status===401||response.status===403) throw new Error('Admin authentication required. Open /admin/login first.');
      if(!response.ok) throw new Error('Pilot dashboard unavailable.');
      const data=await response.json(), d=data.dashboard||{}, byEvent=d.by_event||{}, recovery=d.recovery||{};
      document.querySelector('#metrics').innerHTML=[metric('Events',d.total_events||0),metric('Failures',d.failed_events||0),metric('Failure rate',`${Math.round(Number(d.failure_rate||0)*100)}%`),metric('Days covered',d.days||30)].join('');
      document.querySelector('#recovery').innerHTML=Object.entries(byEvent).map(([name,value])=>metric(name,value)).join('')||'<p class="muted">No events recorded yet.</p>';
      document.querySelector('#feedback-summary').innerHTML=Object.entries(d.feedback||{}).map(([rating,value])=>metric(rating,value)).join('')||'<p class="muted">No feedback received in the selected window.</p>';
      decision(data);
      await loadHandoffs();
    }catch(error){document.querySelector('#decision').className='decision no-go';document.querySelector('#decision').innerHTML=`<strong>UNAVAILABLE</strong><p class="error">${esc(error.message)}</p>`;}
  }
  document.querySelector('#refresh').addEventListener('click',load); load();
</script>
</body>
</html>
