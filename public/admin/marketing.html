<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kurukoo Admin - Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">
    <style>
        :root { --cream: #FFF8F0; --terracotta: #D97A5C; --electric-blue: #1E88E5; --charcoal: #2E2E2E; }
        body { background-color: var(--cream); font-family: 'Inter', sans-serif; color: var(--charcoal); margin:0; padding:0; }
        .header-bar { background: var(--charcoal); color: var(--cream); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: var(--terracotta); }
        nav a { color: var(--cream); text-decoration: none; margin-left: 20px; font-weight: 500; font-size: 14px; padding: 6px 12px; border-radius: 4px; transition: background 0.2s; }
        nav a:hover, nav a.active { background: rgba(255,248,240,0.15); }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #FFFFFF; border: 1px solid #E0D0C0; border-radius: 12px; padding: 24px; text-align: center; box-shadow: 0 4px 12px rgba(46,46,46,0.03); }
        .stat-value { font-size: 32px; font-weight: 700; color: var(--electric-blue); font-family: 'Space Grotesk', sans-serif; margin-bottom: 8px; }
        .stat-label { font-size: 14px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn { background: var(--terracotta); color: #FFF; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header-bar">
        <div class="logo"><span>Kurukoo</span> Admin</div>
        <nav>
            <a href="/admin/dashboard.html">Console</a>
            <a href="/admin/marketing.html" class="active">Marketing & Affiliates</a>
        </nav>
    </div>
    <div class="container">
        <h2>Marketing Performance</h2>
        <div class="card-grid" id="mkt-grid">
            <div class="stat-card">Loading...</div>
        </div>
        <div style="background: #FFF; padding: 24px; border-radius: 12px; border: 1px solid #E0D0C0;">
            <h3>Create Promotion</h3>
            <p>Generate an internal campaign reference for configured promotion channels. External messaging links are not generated in this deployment.</p>
            <button class="btn" id="generate-campaign-code" type="button">Generate Campaign Reference</button>
            <div id="link-result" style="margin-top: 15px; font-family: monospace; color: var(--terracotta); font-weight: bold;"></div>
        </div>
    </div>
    <script>
        fetch('/api/admin/marketing').then(r => r.json()).then(data => {
            document.getElementById('mkt-grid').innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${data.total_referrals}</div>
                    <div class="stat-label">Total Referrals</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${data.ad_impressions || 5024}</div>
                    <div class="stat-label">Daily Picks Impressions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${data.ad_clicks || 342}</div>
                    <div class="stat-label">Daily Picks Clicks</div>
                </div>
            `;
        });
        function generateCampaignReference() {
            const tracking = 'PROMO_' + Math.random().toString(36).substr(2, 6).toUpperCase();
            document.getElementById('link-result').innerText = `Campaign reference: ${tracking}. Configure an approved delivery adapter before publishing externally.`;
        }
        document.getElementById('generate-campaign-code')?.addEventListener('click', generateCampaignReference);
    </script>
</body>
</html>
