<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kurukoo Admin - Commissions & Fees</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">

  <link rel="stylesheet" href="/css/legacy-inline-migration.css?v=1">
</head>
<body>
    <div class="header-bar">
        <div class="logo"><span>Kurukoo</span> Commissions Admin</div>
        <nav>
            <a href="/admin/dashboard.html">Console</a>
            <a href="/admin/users.html">Users</a>
            <a href="/admin/pricing.html">Pricing</a>
            <a href="/admin/commissions.html" class="active">Commissions</a>
            <a href="/dashboard.html" target="_blank">View Live App</a>
        </nav>
    </div>

    <div class="container">
        <div class="legacy-inline-1p6ejdj">
            <h2 class="legacy-inline-13fjtle">Agent Commissions & Platform Fees</h2>
            <p class="legacy-inline-1opwtod">Manage agent payout rates and provider lead fees across the network.</p>
        </div>

        <div class="card-box">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Type / Key</th>
                        <th>Description</th>
                        <th>Rate (Minor Unit)</th>
                        <th>Status</th>
                        <th class="legacy-inline-mzlg82">Actions</th>
                    </tr>
                </thead>
                <tbody id="commissions-tbody">
                    <tr><td colspan="6" class="legacy-inline-wednlv">Loading commission rules...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div id="comm-modal" class="modal">
        <div class="modal-content">
            <h3 class="legacy-inline-x2lfvs">Edit Commission Rule</h3>
            <form id="comm-form" onsubmit="saveCommission(event)">
                <input type="hidden" id="c-id">
                <div class="form-group">
                    <label>Rule Type</label>
                    <input type="text" id="c-type" disabled class="legacy-inline-15om11f">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="c-desc" disabled class="legacy-inline-15om11f">
                </div>
                <div class="form-group">
                    <label>Rate (Minor Unit / Kobo / Pence)</label>
                    <input type="number" id="c-rate" required>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="c-active">
                        <option value="1">Active</option>
                        <option value="0">Inactive</option>
                    </select>
                </div>
                <div class="legacy-inline-1y83w8z">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn">Update Rate</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allCommissions = [];

        function loadCommissions() {
            fetch('/api/admin/commissions')
                .then(res => res.json())
                .then(data => {
                    allCommissions = data;
                    const tbody = document.getElementById('commissions-tbody');
                    tbody.innerHTML = data.map(c => `
                        <tr>
                            <td><strong>#${c.id}</strong></td>
                            <td><code>${c.type}</code></td>
                            <td>${c.description}</td>
                            <td><strong>${c.rate_minor.toLocaleString()}</strong></td>
                            <td><span class="badge ${c.active ? 'badge-active' : 'badge-inactive'}">${c.active ? 'Active' : 'Inactive'}</span></td>
                            <td class="legacy-inline-mzlg82">
                                <button class="btn legacy-inline-1cjag28" onclick="openEditModal(${c.id})">Edit</button>
                                <button class="btn btn-secondary legacy-inline-1cjag28" onclick="toggleCommission(${c.id}, ${c.active ? 0 : 1})">${c.active ? 'Disable' : 'Enable'}</button>
                            </td>
                        </tr>
                    `).join('') || `<tr><td colspan="6" class="legacy-inline-xvvptn">No commission rules found.</td></tr>`;
                })
                .catch(err => console.error('Error loading commissions:', err));
        }

        function openEditModal(id) {
            const c = allCommissions.find(item => item.id === id);
            if (!c) return;
            document.getElementById('c-id').value = c.id;
            document.getElementById('c-type').value = c.type;
            document.getElementById('c-desc').value = c.description;
            document.getElementById('c-rate').value = c.rate_minor;
            document.getElementById('c-active').value = c.active;
            document.getElementById('comm-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('comm-modal').classList.remove('active');
        }

        function saveCommission(e) {
            e.preventDefault();
            const id = document.getElementById('c-id').value;
            const rate_minor = parseInt(document.getElementById('c-rate').value);
            const active = parseInt(document.getElementById('c-active').value);

            fetch(`/api/admin/commissions/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rate_minor, active })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    closeModal();
                    loadCommissions();
                } else {
                    alert('Failed to update commission rule');
                }
            })
            .catch(err => {
                console.error(err);
                alert('Error saving commission rule');
            });
        }

        function toggleCommission(id, newActive) {
            const c = allCommissions.find(item => item.id === id);
            if (!c) return;
            fetch(`/api/admin/commissions/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rate_minor: c.rate_minor, active: newActive })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadCommissions();
                } else {
                    alert('Failed to toggle commission status');
                }
            })
            .catch(err => console.error(err));
        }

        window.onload = loadCommissions;
    </script>
</body>
</html>
