name: PR diagnostics
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [feature/platform-convergence-frames]
  workflow_dispatch:
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture TypeScript errors
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > /tmp/tsc.txt 2>&1
          code=$?
          echo "exit=$code" >> /tmp/tsc.txt
          cat /tmp/tsc.txt
          exit 0
      - name: Capture bin-day errors
        shell: bash
        run: |
          set +e
          npx tsx scripts/test-bin-day-outcome.ts > /tmp/binday.txt 2>&1
          code=$?
          echo "exit=$code" >> /tmp/binday.txt
          cat /tmp/binday.txt
          exit 0
      - name: Report diagnostics on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tsc = fs.readFileSync('/tmp/tsc.txt', 'utf8').slice(-12000);
            const binday = fs.readFileSync('/tmp/binday.txt', 'utf8').slice(-12000);
            const body = `## Temporary convergence diagnostics\n\n### TypeScript\n\n\`\`\`text\n${tsc}\n\`\`\`\n\n### Bin-day contract\n\n\`\`\`text\n${binday}\n\`\`\``;
            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }
