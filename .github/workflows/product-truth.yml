name: Kurukoo product truth
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-product-truth.mjs
      - run: npm run lint
