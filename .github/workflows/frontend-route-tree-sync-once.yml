name: Frontend route tree sync once
on:
  push:
    paths:
      - 'frontend/src/routes/**'
      - 'frontend/src/routeTree.gen.ts'
permissions:
  contents: write
jobs:
  sync:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(frontend): sync generated route tree') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Commit generated route tree
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/routeTree.gen.ts
          git diff --cached --quiet && exit 0
          git commit -m 'chore(frontend): sync generated route tree'
          git push
