name: Reconcile convergence branch

on:
  push:
    branches: [feature/kurukoo-student-v1-training]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/kurukoo-student-v1-training
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge current main without destructive conflict resolution
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'main is already an ancestor of the convergence branch.'
            exit 0
          fi
          git merge --no-edit origin/main
          git push origin HEAD:feature/kurukoo-student-v1-training
