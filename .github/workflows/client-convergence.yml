name: Client convergence

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsx scripts/test-client-surface-coverage.ts
      - run: node scripts/test-canonical-authenticated-screen-set.mjs
      - run: npx tsx scripts/test-product-surface-completeness.ts
      - run: npx tsx scripts/test-os-shell-contract.ts
      - run: npx tsx scripts/test-mistral-policy.ts
      - run: npx tsx scripts/test-ai-provider-policy.ts
      - run: npm run audit:accessibility
      - run: npm run audit:css:all
      - run: npm run audit:css:strict
      - run: npm run test:chat-dom-safety
      - run: npm run lint

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile/kurukoo-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:ci
      - run: pnpm build
