name: Kurukoo staging provider activation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-provider-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type safety
        run: npm run lint
      - name: Durable provider inquiry recovery
        run: npm run test:provider-inquiry-recovery
      - name: Explicit provider selection and reply evidence
        run: npm run test:fulfilment-storefront-integration
      - name: Africa's Talking callback contract
        run: npm run test:africastalking-sms-callback

  deployed-callback-routing:
    needs: canonical-provider-loop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KURUKOO_BASE_URL: ${{ secrets.KURUKOO_STAGING_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify deployed root and legacy provider callbacks
        if: ${{ env.KURUKOO_BASE_URL != '' }}
        run: npm run test:deployed-provider-callbacks
      - name: Report unavailable staging target
        if: ${{ env.KURUKOO_BASE_URL == '' }}
        run: |
          echo "KURUKOO_STAGING_BASE_URL is not configured."
          echo "The canonical provider loop passed, but no public deployment has been verified."
          echo "This is intentionally not treated as live activation."
