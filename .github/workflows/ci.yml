name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm run test:routes
      # The active transformer chain has a documented upstream high advisory with no safe npm fix.
      # Keep all advisories visible while blocking any critical production dependency finding.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run audit:css:all
      - run: npm run audit:messaging
      - run: npm run audit:skills
      - run: npm run audit:economic
      - run: npm run audit:services
      - run: npm run audit:security
      - run: npm run test:email

  fasttext:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install FastText CLI
        run: sudo apt-get update -qq && sudo apt-get install -y fasttext
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run fasttext:build
      - name: Verify FastText model
        run: npm run fasttext:test

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans the PR's commit range; the parent must be present.
          fetch-depth: 0
      - name: Scan working tree for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
