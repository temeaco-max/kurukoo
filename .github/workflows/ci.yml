name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KURUKOO_TEST_COMMAND_TIMEOUT_MS: 600000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cache local Hugging Face model artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-kurukoo-smollm2-360m-${{ hashFiles('package-lock.json', 'scripts/test-smollm2-local.ts') }}
          restore-keys: |
            ${{ runner.os }}-kurukoo-smollm2-360m-
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Run platform convergence gate
        run: npx tsx scripts/audit-platform-convergence.ts
      - name: Run platform runtime foundation contract
        run: npx tsx scripts/test-platform-foundations.ts
      - name: Economic category convergence
        run: npx tsx scripts/test-economic-category-convergence.ts
      - name: Canonical skill catalogue integrity
        run: npx tsx scripts/audit-canonical-skill-catalogue.ts
      - name: Unknown-intent learning loop contract
        run: npx tsx scripts/test-unknown-intent-review.ts
      - name: AI runtime controls contract
        run: npx tsx scripts/test-ai-runtime-controls.ts
      - name: Discover experience contract
        run: npx tsx scripts/test-discover-experience.ts
      - name: Bin-day end-to-end contract
        run: npx tsx scripts/test-bin-day-outcome.ts
      - name: Catalogue inventory matcher contract
        run: npx tsx scripts/test-catalogue-inventory-matcher.ts
      - name: Broad route contracts
        run: npm run test:routes
      - name: Upload route-suite diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-suite-log
          path: .artifacts/test-route-sequence.log
          if-no-files-found: ignore
      - name: Hugging Face Jobs training backend contract
        run: npm run test:huggingface-jobs-backend
      - name: Hosted provider routing and retired Hugging Face serverless boundary
        run: npm run test:hosted-provider-resolution && npm run test:hosted-provider-failover && npm run test:smollm2-serverless-deprecation
      - name: Progressive identity contract
        run: npx tsx scripts/test-progressive-identity.ts
      - name: Food request identity and context resume
        run: npm run test:food-auth-context-resume
      - name: Artifact storage ownership and durability contract
        run: npm run test:artifact-storage
      - name: Google Sheets source ownership and lifecycle contract
        run: npm run test:google-sheets-source
      - name: Notion source ownership and lifecycle contract
        run: npm run test:notion-source
      - name: Microsoft Graph source ownership and lifecycle contract
        run: npm run test:microsoft-graph-source
      - name: Canonical external integration readiness contract
        run: npm run test:external-integration-readiness
      - name: Mistral Voxtral TTS contract
        run: npm run test:mistral-tts
      - name: Remote MCP app contract
        run: npx tsx scripts/test-mcp-app.ts
      - name: Pulse privacy contract
        run: npx tsx scripts/test-pulse-privacy.ts
      - name: Attachment security contract
        run: npx tsx scripts/test-attachment-boundary.ts
      - name: Database schema drift audit
        run: node scripts/audit-database-schema.mjs
      - name: Production preflight parser
        run: NODE_ENV=development node scripts/production-preflight.mjs
      - name: Infrastructure manifests
        run: cp .env.example .env && POSTGRES_PASSWORD=ci-only-dont-use docker compose -f docker-compose.production.yml config --quiet
      - name: Build production container
        run: docker build --file Dockerfile --tag kurukoo:ci .
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run audit:css:all
      - run: npm run audit:messaging
      - run: npm run audit:skills
      - run: npm run audit:economic
      - run: npm run audit:services
      - run: npm run audit:security
      - run: npm run test:email

  fasttext:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install FastText CLI
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get -o Acquire::Retries=3 update -qq && \
               timeout 240 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends fasttext; then
              exit 0
            fi
            echo "FastText installation attempt ${attempt}/3 failed; retrying shortly." >&2
            sleep $((attempt * 15))
          done
          echo "FastText installation failed after bounded retries." >&2
          exit 1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run fasttext:build
      - name: Verify FastText model
        run: npm run fasttext:test

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/kurukoo-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck mobile client
        run: pnpm check
      - name: Test mobile client
        run: pnpm test
      - name: Build mobile server bundle
        run: pnpm build

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.24.3
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan checked-out repository tree for secrets
        shell: bash
        run: |
          set +e
          gitleaks detect --source . --no-git --redact --report-format json --report-path gitleaks-report.json --exit-code 2
          status=$?
          if [ -f gitleaks-report.json ]; then
            node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("gitleaks-report.json","utf8")); for (const x of r) console.log(JSON.stringify({ruleID:x.RuleID,file:x.File,line:x.StartLine,commit:x.Commit,description:x.Description,match:x.Match?"[REDACTED]":"[NONE]"}));'
          fi
          exit $status
      - name: Upload redacted Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
