name: Provider SMS Loop

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  provider-sms-loop:
    name: provider-sms-loop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify configured callback routes
        run: npm run test:africastalking-sms-callback
      - name: Verify provider request-to-outcome loop
        run: npm run test:fulfilment-storefront-integration
      - name: Type-check changed integration
        run: npm run lint
