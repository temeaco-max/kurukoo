name: Owner Activation Verification

on:
  workflow_dispatch:
    inputs:
      live_mistral:
        description: 'Run the live Mistral generation smoke test'
        required: false
        default: false
        type: boolean
      report_only:
        description: 'Only print configured activation readiness; never call provider APIs'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  activation:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      KURUKOO_DEFAULT_COUNTRY: ng
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      FF_HOSTED_MISTRAL: 'true'
      KURUKOO_AI_PRIMARY_PROVIDER: mistral
      KURUKOO_AI_BYPASS_SMOLLM2: 'true'
      KURUKOO_GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.KURUKOO_GOOGLE_DRIVE_CLIENT_ID }}
      KURUKOO_GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.KURUKOO_GOOGLE_DRIVE_CLIENT_SECRET }}
      KURUKOO_GOOGLE_DRIVE_REDIRECT_URI: ${{ secrets.KURUKOO_GOOGLE_DRIVE_REDIRECT_URI }}
      KURUKOO_STORAGE_ENCRYPTION_KEY: ${{ secrets.KURUKOO_STORAGE_ENCRYPTION_KEY }}
      FF_GOOGLE_DRIVE: ${{ secrets.FF_GOOGLE_DRIVE || 'false' }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      KURUKOO_TELEGRAM_LINKED_DEVICE_ENABLED: ${{ secrets.KURUKOO_TELEGRAM_LINKED_DEVICE_ENABLED || 'false' }}
      KURUKOO_TELEGRAM_LINKED_DEVICE_ALLOW: ${{ secrets.KURUKOO_TELEGRAM_LINKED_DEVICE_ALLOW || 'false' }}
      KURUKOO_TELEGRAM_LINKED_DEVICE_OWNER_PHONE: ${{ secrets.KURUKOO_TELEGRAM_LINKED_DEVICE_OWNER_PHONE }}
      KURUKOO_WHATSAPP_LINKED_DEVICE_ENABLED: ${{ secrets.KURUKOO_WHATSAPP_LINKED_DEVICE_ENABLED || 'false' }}
      KURUKOO_WHATSAPP_LINKED_DEVICE_ALLOW: ${{ secrets.KURUKOO_WHATSAPP_LINKED_DEVICE_ALLOW || 'false' }}
      KURUKOO_WHATSAPP_LINKED_DEVICE_OWNER_PHONE: ${{ secrets.KURUKOO_WHATSAPP_LINKED_DEVICE_OWNER_PHONE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify configuration and canonical provider selection
        run: npx tsx scripts/verify-owner-activations.ts
      - name: Run Mistral live smoke test
        if: ${{ inputs.live_mistral == true }}
        run: npx tsx scripts/live-activation-harness.ts mistral
      - name: Print next interactive activation steps
        run: |
          cat <<'EOF'
          Live configuration verification is complete.

          Google Drive, Telegram linked-device, and WhatsApp linked-device activation still require interactive owner/device evidence and therefore are not marked live merely by this workflow.

          Use the repository runbook:
            docs/deployment/local-live-integration-activation.md
          EOF
