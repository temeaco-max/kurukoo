apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: kurukoo
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        # SQL.js remains single-process only. This cap removes replica-level split-brain risk,
        # but it does not make container-local storage durable. Startup remains blocked below
        # until a shared durable persistence adapter is implemented and activated.
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/kurukoo:TAG
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "4"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            - name: KURUKOO_CLOUD_RUN
              value: "true"
            - name: KURUKOO_DATABASE_MODE
              value: "sqljs"
            - name: KURUKOO_PERSISTENT_STATE_REQUIRED
              value: "true"
            - name: KURUKOO_JOB_MODE
              value: "in_process"
            - name: KURUKOO_WORKERS
              value: "1"
            - name: KURUKOO_SMOLLM2_LOCAL
              value: "true"
            - name: KURUKOO_CLOUD_RUN_REQUIRE_MODEL
              value: "true"
            - name: SMOLLM2_MODEL
              value: HuggingFaceTB/SmolLM2-1.7B-Instruct
            - name: SMOLLM2_FALLBACK_MODEL
              value: HuggingFaceTB/SmolLM2-1.7B-Instruct
            - name: SMOLLM2_DTYPE
              value: q4
            - name: SMOLLM2_MAX_NEW_TOKENS
              value: "192"
            - name: HF_HOME
              value: /tmp/huggingface
            - name: HF_HUB_CACHE
              value: /tmp/huggingface
            - name: KURUKOO_SMOLLM2_CACHE_DIR
              value: /tmp/huggingface
            - name: KURUKOO_EXTERNAL_EXECUTION_ENABLED
              value: "false"
            - name: KURUKOO_COORDINATOR_TEACHER_ENABLED
              value: "false"
            - name: KURUKOO_COORDINATOR_PROMOTION_ENABLED
              value: "false"
